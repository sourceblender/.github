name: Bug report
description: Report a reproducible problem that is not a security vulnerability
title: "bug: "
body:
  - type: markdown
    attributes:
      value: "For security issues, use the repository's Security tab or SECURITY.md. Redact credentials and personal or memory data."
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Include what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Use a minimal example with synthetic data.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment and relevant logs
      description: Include only redacted, relevant output.
    validations:
      required: false
